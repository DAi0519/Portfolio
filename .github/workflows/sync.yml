#
# [INPUT]: 依赖 GitHub Secrets、Node.js 24 与 scripts/sync-notion.ts
# [OUTPUT]: 每 30 分钟或手动执行 Notion 到 Supabase 的内容与临时媒体链接刷新
# [POS]: .github/workflows 的内容同步任务，替代 Vercel Cron 调度但不负责网站部署
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
#
name: Sync Notion Content

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Notion 托管媒体链接约 1 小时过期，半小时刷新为调度延迟留出余量。
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: notion-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh Notion content
        run: npm run sync
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
